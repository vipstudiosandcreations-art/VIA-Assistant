name: Build VIA APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project zip (only if the project was uploaded as a zip)
        run: |
          if [ ! -f settings.gradle.kts ] && [ -f via-project.zip ]; then
            unzip -q -o via-project.zip
          fi
          ls

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VIA-debug-apk
          path: app/build/outputs/apk/debug/*.apk
